
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10283a">
  <title>冰河地形 AR｜第二版</title>

  <!-- 固定版本，與第一階段相同 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Noto Sans TC", sans-serif;
      background: #071520;
      color: #fff;
    }

    /* 相機影像與 AR 3D 畫面的圖層 */
    #ar-root {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background: #071520;
    }

    /* MindAR 原始 video 預設 z-index:-2，
       改為可見但位於 3D 畫布後方 */
    #ar-root > video {
      z-index: 0 !important;
      display: block !important;
      pointer-events: none;
    }

    #ar-root > a-scene {
      position: absolute !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
      background: transparent !important;
    }

    #ar-root canvas {
      background: transparent !important;
    }

    /* 控制介面 */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    #top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: calc(env(safe-area-inset-top) + 10px)
               12px 0;
      display: flex;
      justify-content: center;
    }

    #status-card {
      width: min(100%, 560px);
      padding: 11px 14px;
      border-radius: 14px;
      background: rgba(10, 30, 44, .85);
      box-shadow: 0 4px 18px rgba(0,0,0,.2);
      backdrop-filter: blur(7px);
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #signal {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f5bc5c;
      box-shadow: 0 0 0 3px rgba(245,188,92,.15);
    }

    body.tracking #signal {
      background: #62d8a5;
      box-shadow: 0 0 0 3px rgba(98,216,165,.18);
    }

    body.error #signal {
      background: #fa7777;
      box-shadow: 0 0 0 3px rgba(250,119,119,.18);
    }

    #status-title {
      font-size: 15px;
      font-weight: 700;
    }

    #status-desc {
      margin: 5px 0 0 18px;
      font-size: 13px;
      line-height: 1.45;
      color: #d9e7ef;
    }

    /* 相機預覽對準框 */
    #aim {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(78vw, 500px);
      aspect-ratio: 1.81 / 1;
      border: 1px solid rgba(255,255,255,.33);
      border-radius: 12px;
      transition: opacity .15s;
    }

    body.tracking #aim {
      opacity: .2;
    }

    .corner {
      position: absolute;
      width: 26px;
      height: 26px;
      border: 0 solid #fff;
    }

    .tl {
      top: -2px; left: -2px;
      border-top-width: 4px;
      border-left-width: 4px;
      border-top-left-radius: 10px;
    }

    .tr {
      top: -2px; right: -2px;
      border-top-width: 4px;
      border-right-width: 4px;
      border-top-right-radius: 10px;
    }

    .bl {
      bottom: -2px; left: -2px;
      border-bottom-width: 4px;
      border-left-width: 4px;
      border-bottom-left-radius: 10px;
    }

    .br {
      bottom: -2px; right: -2px;
      border-bottom-width: 4px;
      border-right-width: 4px;
      border-bottom-right-radius: 10px;
    }

    #aim-caption {
      position: absolute;
      left: 50%;
      top: calc(100% + 12px);
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 7px 11px;
      border-radius: 100px;
      background: rgba(10,30,44,.8);
      font-size: 12px;
    }

    /* 標籤說明 */
    #explanation {
      display: none;
      position: absolute;
      top: calc(env(safe-area-inset-top) + 94px);
      right: 12px;
      width: min(62vw, 235px);
      padding: 12px;
      border-radius: 12px;
      background: rgba(10,30,44,.85);
      font-size: 12px;
      line-height: 1.6;
    }

    #explanation strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    #explanation.is-visible {
      display: block;
    }

    /* 底部功能按鈕 */
    #bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 10px
        calc(env(safe-area-inset-bottom) + 12px);
      background: linear-gradient(
        transparent, rgba(3,15,23,.75)
      );
      pointer-events: auto;
    }

    button, .button-link {
      min-height: 44px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      background: rgba(13,40,58,.92);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
    }

    button[aria-pressed="true"] {
      background: #d8f5fb;
      color: #12354a;
    }

    button:focus-visible,
    .button-link:focus-visible {
      outline: 3px solid #9be4f5;
      outline-offset: 2px;
    }

    @media (max-width: 380px) {
      button, .button-link {
        font-size: 12px;
        padding-inline: 9px;
      }
      #explanation {
        top: calc(env(safe-area-inset-top) + 108px);
      }
    }
  </style>
</head>

<body>

  <!-- AR 場景與相機 -->
  <div id="ar-root">

    <a-scene
      id="ar-scene"
      embedded
      mindar-image="
        imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;
        maxTrack: 1;
        filterMinCF: 0.1;
        filterBeta: 10;
        warmupTolerance: 5;
        missTolerance: 8;
        uiLoading: no;
        uiScanning: no;
        uiError: no;
      "
      color-space="sRGB"
      renderer="alpha: true; antialias: true; colorManagement: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <!-- 追蹤圖卡的錨定節點 -->
      <a-entity
        id="tracked"
        mindar-image-target="targetIndex: 0">

        <!-- 測試用立體山體 -->
        <a-entity id="terrain" visible="true">

          <a-circle
            radius="0.34"
            color="#35627b"
            opacity="0.65"
            position="0 0 0.008">
          </a-circle>

          <a-cone
            color="#758a99"
            height="0.29"
            radius-bottom="0.18"
            position="-0.19 0.07 0.145"
            rotation="90 0 0">
          </a-cone>

          <a-cone
            color="#9bb0bc"
            height="0.34"
            radius-bottom="0.20"
            position="0.17 0.08 0.170"
            rotation="90 0 0">
          </a-cone>

          <a-cone
            color="#e3f0f5"
            height="0.13"
            radius-bottom="0.065"
            position="-0.19 0.07 0.32"
            rotation="90 0 0">
          </a-cone>

          <a-cone
            color="#e3f0f5"
            height="0.16"
            radius-bottom="0.075"
            position="0.17 0.08 0.38"
            rotation="90 0 0">
          </a-cone>

          <a-box
            color="#57bfe6"
            opacity="0.85"
            width="0.085"
            height="0.50"
            depth="0.025"
            position="-0.005 -0.11 0.065"
            rotation="0 0 -11">
          </a-box>

        </a-entity>

        <!--
          定位點：
          原始測試卡寬度標準化為 1，
          高度約為 0.552。

          四個紅色圓圈是紙面對位參考。
          中央藍色圓圈標示圖卡中心。
        -->
        <a-entity id="pins" visible="false">

          <a-ring
            color="#ff715b"
            radius-inner="0.021"
            radius-outer="0.028"
            position="-0.465 0.242 0.020">
          </a-ring>

          <a-ring
            color="#ff715b"
            radius-inner="0.021"
            radius-outer="0.028"
            position="0.465 0.242 0.020">
          </a-ring>

          <a-ring
            color="#ff715b"
            radius-inner="0.021"
            radius-outer="0.028"
            position="-0.465 -0.242 0.020">
          </a-ring>

          <a-ring
            color="#ff715b"
            radius-inner="0.021"
            radius-outer="0.028"
            position="0.465 -0.242 0.020">
          </a-ring>

          <a-ring
            color="#7de4ff"
            radius-inner="0.018"
            radius-outer="0.025"
            position="0 0 0.024">
          </a-ring>

        </a-entity>

        <!-- 測試模型數字標記 -->
        <a-entity id="labels" visible="false">

          <a-text
            value="1"
            color="#fff8cb"
            align="center"
            width="0.45"
            position="-0.19 0.07 0.45"
            side="double">
          </a-text>

          <a-text
            value="2"
            color="#fff8cb"
            align="center"
            width="0.45"
            position="0.17 0.08 0.50"
            side="double">
          </a-text>

          <a-text
            value="3"
            color="#fff8cb"
            align="center"
            width="0.45"
            position="0 -0.15 0.15"
            side="double">
          </a-text>

        </a-entity>

      </a-entity>

      <a-ambient-light intensity="0.85">
      </a-ambient-light>

      <a-directional-light
        intensity="0.85"
        position="0.6 0.8 2">
      </a-directional-light>

    </a-scene>
  </div>

  <!-- 相機預覽上的介面 -->
  <div id="hud">

    <div id="top">
      <div id="status-card" role="status" aria-live="polite">
        <div class="status-line">
          <span id="signal"></span>
          <span id="status-title">正在啟動 AR 相機</span>
        </div>
        <p id="status-desc">
          請使用 iPad Safari 並允許相機權限。
        </p>
      </div>
    </div>

    <!-- 對準框 -->
    <div id="aim" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <div id="aim-caption">
        將整張彩色測試圖卡對準框內
      </div>
    </div>

    <!-- 模型解說 -->
    <div id="explanation">
      <strong>模型測試標記</strong>
      1：左側山峰<br>
      2：右側山峰<br>
      3：中央谷地<br><br>
      這只是 AR 操作測試，不是冰蝕地形的標準答案。
    </div>

    <!-- 按鈕 -->
    <div id="bottom">

      <button id="btn-terrain"
              type="button"
              aria-pressed="true">
        隱藏模型
      </button>

      <button id="btn-pins"
              type="button"
              aria-pressed="false">
        顯示定位點
      </button>

      <button id="btn-labels"
              type="button"
              aria-pressed="false">
        顯示標籤
      </button>

      <a class="button-link"
         href="print.html"
         target="_blank"
         rel="noopener">
        開啟圖卡
      </a>

    </div>
  </div>

  <script>
    const scene = document.getElementById('ar-scene');
    const target = document.getElementById('tracked');

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const aimCaption = document.getElementById('aim-caption');
    const explanation = document.getElementById('explanation');

    // 更新相機和定位狀態
    function setStatus(title, detail, mode) {
      document.body.classList.toggle(
        'tracking', mode === 'tracking'
      );
      document.body.classList.toggle(
        'error', mode === 'error'
      );

      statusTitle.textContent = title;
      statusDesc.textContent = detail;
    }

    // AR 相機啟動成功
    scene.addEventListener('arReady', () => {
      setStatus(
        '相機已啟動｜正在尋找圖卡',
        '畫面應顯示即時影像；請對準第一階段的彩色測試圖卡。'
      );
    });

    // AR 啟動失敗
    scene.addEventListener('arError', () => {
      setStatus(
        '相機或 AR 啟動失敗',
        '請確認 Safari 相機權限、HTTPS，以及網路連線；也可重新整理。',
        'error'
      );
    });

    // 找到圖卡
    target.addEventListener('targetFound', () => {
      setStatus(
        '已定位｜追蹤中',
        '請緩慢移動 iPad，檢查模型和圖卡是否同步移動。',
        'tracking'
      );

      aimCaption.textContent = '辨識成功';
    });

    // 失去圖卡
    target.addEventListener('targetLost', () => {
      setStatus(
        '暫時失去定位',
        '請將圖卡重新放回鏡頭中央，注意照明、反光及遮擋。'
      );

      aimCaption.textContent =
        '將整張彩色測試圖卡對準框內';
    });

    // 通用顯示開關
    function setupToggle(
      buttonId,
      entityId,
      initiallyVisible,
      labelWhenVisible,
      labelWhenHidden,
      onToggle
    ) {
      const button = document.getElementById(buttonId);
      const entity = document.getElementById(entityId);

      let visible = initiallyVisible;

      entity.setAttribute('visible', visible);
      button.setAttribute('aria-pressed', String(visible));
      button.textContent = visible
        ? labelWhenVisible
        : labelWhenHidden;

      button.addEventListener('click', () => {
        visible = !visible;

        entity.setAttribute('visible', visible);
        button.setAttribute('aria-pressed', String(visible));

        button.textContent = visible
          ? labelWhenVisible
          : labelWhenHidden;

        if (onToggle) onToggle(visible);
      });
    }

    // 模型開關
    setupToggle(
      'btn-terrain',
      'terrain',
      true,
      '隱藏模型',
      '顯示模型'
    );

    // 定位點開關
    setupToggle(
      'btn-pins',
      'pins',
      false,
      '隱藏定位點',
      '顯示定位點'
    );

    // 標籤開關
    setupToggle(
      'btn-labels',
      'labels',
      false,
      '隱藏標籤',
      '顯示標籤',
      (visible) => {
        explanation.classList.toggle(
          'is-visible',
          visible
        );
      }
    );
  </script>

</body>
</html>
