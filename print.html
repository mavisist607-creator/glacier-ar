<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>冰河 AR 第一階段：測試圖卡</title>
  <style>
    body { margin:0; color:#1b2934; font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; background:#f0f3f7; }
    main { background:white; max-width:210mm; min-height:297mm; margin:16px auto; padding:13mm; box-sizing:border-box; text-align:center; box-shadow:0 3px 20px #0002; }
    h1 {font-size:24px;margin:0 0 10px;}
    p {font-size:16px;line-height:1.5;}
    img {display:block;width:90mm;height:auto;margin:15mm auto 5mm;}
    .notice {font-size:14px;color:#52616d;}
    @media print { @page {size:A4 portrait;margin:0;} body {background:white;} main {margin:0;box-shadow:none;min-height:297mm;} .screen-only {display:none;} }
  </style>
</head>
<body>
  <main>
    <h1>冰河 AR｜辨識測試圖卡</h1>
    <p>用 iPad Safari 開啟 AR 網頁，再以相機對準下方整張彩色圖卡。</p>
    <img src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" alt="MindAR 官方測試圖卡（彩色抽象文字圖案）">
    <p class="notice">第一階段只測試 AR 辨識與追蹤；圖卡不是冰河等高線。<br>列印時請保留原比例、彩色優先、不要裁掉圖卡邊緣。</p>
    <p class="screen-only"><button onclick="window.print()" style="padding:12px 24px;font-size:16px">列印這張 A4 圖卡</button></p>
  </main>
</body>
</html>
